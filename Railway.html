<!DOCTYPE html>
<html>
<head>
    <title>Railway Management System</title>
</head>
<style>
    .train{
           background-color:yellow;
           text-align:center;
           font-family:'Courier New', Courier, monospace;
           border:solid black;
    }
    .delay{
           background-color:red;
           text-align:center;
    }
    .ontime{
            background-color:green;
            text-align:center;
    }

</style>
<body>
    <h1>Railway Information Board</h1>
    <p id="railway"></p>
    <script>
        train1no=12343;
        train2no=12344;
        train3no=12345;
        let output = "";    
        let no = Number(prompt("Enter Train No"));
        if ( no == train1no){
              output = "<div class='train'>";
              output+="Train no:12343"+"<br>";
              output+="Train Name:Chennai Express"+"<br>";
              output+="Arrival Time-5:30am"+"<br>";
              output+="Departure Time-5:50 am"+"<br>";
              output+="Platform No:5"+"<br>";
              output+="</div>";
              output+="<br>"+"<div class='delay'>Train is delayed</div>";
        }
        else if ( no == train2no){
              output = "<div class='train'>";
              output+="Train no:12344"+"<br>";
              output+="Train Name:Bengaluru Express"+"<br>";
              output+="Arrival Time-10:00 pm"+"<br>";
              output+="Departure Time-10:15 pm"+"<br>";
              output+="Platform No:3"+"<br>";
              output+="</div>";
              output+="<br>"+"<div class='ontime'>Train is on time</div>";
        }
        else if ( no == train3no){
              output = "<div class='train'>";
              output+="Train no:12345"+"<br>";
              output+="Train Name:Mumbai Express"+"<br>";
              output+="Arrival Time-3:30 pm"+"<br>";
              output+="Departure Time-3:45 pm"+"<br>";
              output+="Platform No:1"+"<br>";
              output+="</div>";
              output+="<br>"+"<div class='delay'>Train is delayed</div>";
        }
        else{
            output = "Train Not Found";
        }
        document.getElementById("railway").innerHTML = output;

    </script>
</body>
</html>
